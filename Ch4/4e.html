<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .inputs {
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 30px;
        margin-left: 30px;
      }

      .paragraph {
        font-size: 30px;
      }

      .input-fields {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 230px;
      }

      .input-fields input {
        padding: 10px 20px;
        border-radius: 6px;
        border-width: 2px;
        width: 100%;
      }

      .password-input {
        position: relative;
        gap: 5px;
      }

      .password-input button {
        position: absolute;
        top: 8px;
        right: 10px;
      }

      .input-fields input:focus {
        outline: none;
        border-style: solid;
        border-color: blue;
      }

      .two-buttons {
        display: flex;
        gap: 5px;
      }

      .two-buttons button {
        border: none;
        color: white;
        background-color: rgb(0, 123, 255);
        padding: 10px 15px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js" defer></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function WebsiteInput() {
        const [showPassword, togglePassword] = React.useState(true);
        function PasswordButtonClick() {
          togglePassword(!showPassword);
        }

        return (
          <div class="inputs">
            <div class="paragraph">Hello, welcome to my website</div>
            <div class="input-fields">
              <input type="email" placeholder="Email"></input>
              <div class="password-input">
                <input
                  type={showPassword ? "password" : "text"}
                  placeholder="Password"
                ></input>
                <button
                  onClick={PasswordButtonClick}
                  class="show-password-button"
                >
                  {showPassword ? "Show" : "Hide"}
                </button>
              </div>
            </div>
            <div class="two-buttons">
              <button class="login-button">Login</button>
              <button class="signup-button">Sign Up</button>
            </div>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<WebsiteInput />);
    </script>
  </body>
</html>
