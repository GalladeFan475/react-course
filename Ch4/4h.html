<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .body {
        margin: 0;
      }

      .buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: rgb(222, 222, 222);
      }

      .buttons button {
        color: white;
        background-color: rgb(25, 135, 84);
        border: none;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function Button() {
        const [clickCount, setClickCount] = React.useState(0);
        const autoClickRef = React.useRef(null);

        function increaseCount() {
          setClickCount(clickCount + 1);
        }

        function resetCount() {
          setClickCount(0);
        }

        function autoClick() {
          setInterval(() => {
            const buttonElem = autoClickRef.current;
            if (buttonElem) {
              buttonElem.click();
            }
          }, 1000);
        }

        return (
          <div class="buttons">
            <button
              ref={autoClickRef}
              onClick={increaseCount}
              class="counter-button"
            >
              Clicked {clickCount} {clickCount === 1 ? "time" : "times"}
            </button>
            <button onClick={resetCount} class="reset-button">
              Reset
            </button>
            <button onClick={autoClick} class="auto-click-button">
              Auto Click
            </button>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<Button />);
    </script>
  </body>
</html>
