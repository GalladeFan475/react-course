<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      button {
        color: white;
        border: none;
        border-radius: 7px;
        margin-top: 30px;
        margin-left: 30px;
        font-size: 20px;
        padding: 13px 23px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js" defer></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Button() {
        const [isButtonOn, toggleButton] = React.useState(true);
        function buttonClick() {
          toggleButton(!isButtonOn);
        }
        return (
          <button
            style={{
              backgroundColor: isButtonOn
                ? "rgb(25, 135, 84)"
                : "rgb(220, 53, 69)",
            }}
            onClick={buttonClick}
          >
            {isButtonOn ? "ON" : "OFF"}
          </button>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<Button />);
    </script>
  </body>
</html>
